name: Debug

on:
  workflow_dispatch:

env:
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  probe:
    name: probe cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust
        id: rust
        continue-on-error: true
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$FORGEJO_PATH"

      - name: Cache
        id: cache
        continue-on-error: true
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: target
          key: probe-${{ forgejo.sha }}

      - name: Report
        if: always()
        run: |
          set +e
          {
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "rust=${{ steps.rust.outcome }}"
            echo "cache=${{ steps.cache.outcome }}"
            echo "cache_url=${{ steps.cache.outputs.cache-hit }}"
          } > /tmp/report.txt
          CONTENT=$(base64 -w0 /tmp/report.txt)
          printf '{"message":"cache probe","branch":"ci-debug","content":"%s"}' "$CONTENT" > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: token ${{ forgejo.token }}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json \
            "${{ forgejo.api_url }}/repos/${{ forgejo.repository }}/contents/ci-report.txt"
