name: Debug

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  probe:
    name: probe checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          SERVER="${{ forgejo.server_url }}"
          SCHEME="${SERVER%%://*}"
          HOST="${SERVER#*://}"
          URL="${SCHEME}://x-access-token:${{ forgejo.token }}@${HOST}/${{ forgejo.repository }}.git"
          git init -q .
          git remote add origin "$URL"
          git fetch -q --depth 1 origin "${{ forgejo.ref_name }}"
          git checkout -q FETCH_HEAD
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN" \
            --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$FORGEJO_PATH"

      - name: Run the checks
        run: |
          set +e
          exec > /tmp/report.txt 2>&1
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "pwd=$(pwd)"; ls
          cargo --version; rustc --version
          echo "=== fmt ==="; cargo fmt --all -- --check; echo "fmt_exit=$?"

      - name: Report
        if: always()
        run: |
          set +e
          CONTENT=$(base64 -w0 /tmp/report.txt)
          printf '{"message":"ci report","branch":"ci-debug","content":"%s"}' "$CONTENT" > /tmp/payload.json
          curl -sS -o /dev/null -w 'api_http=%{http_code}\n' -X POST \
            -H "Authorization: token ${{ secrets.DIAG_TOKEN }}" \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json \
            "${{ forgejo.api_url }}/repos/${{ forgejo.repository }}/contents/ci-report.txt"
