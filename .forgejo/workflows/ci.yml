name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  check:
    name: format, lint, test, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # No `uses:` actions: the runner image may not ship node, which Node-based
      # actions (such as actions/checkout) need.
      - name: Checkout
        run: |
          set -euo pipefail
          SERVER="${{ forgejo.server_url }}"
          SCHEME="${SERVER%%://*}"
          HOST="${SERVER#*://}"
          URL="${SCHEME}://x-access-token:${{ forgejo.token }}@${HOST}/${{ forgejo.repository }}.git"
          git init -q .
          git remote add origin "$URL"
          git fetch -q --depth 1 origin "${{ forgejo.ref_name }}"
          git checkout -q FETCH_HEAD
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN" \
            --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$FORGEJO_PATH"
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny cargo-audit

      - name: Dependencies (licenses, bans, sources)
        run: cargo deny check

      - name: Security advisories
        run: cargo audit

  mutants:
    name: mutation gate (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          SERVER="${{ forgejo.server_url }}"
          SCHEME="${SERVER%%://*}"
          HOST="${SERVER#*://}"
          URL="${SCHEME}://x-access-token:${{ forgejo.token }}@${HOST}/${{ forgejo.repository }}.git"
          git init -q .
          git remote add origin "$URL"
          git fetch -q --depth 1 origin "${{ forgejo.ref_name }}"
          git checkout -q FETCH_HEAD
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$FORGEJO_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      - name: Mutation gate (100% required)
        run: ./scripts/mutation-gate.sh
