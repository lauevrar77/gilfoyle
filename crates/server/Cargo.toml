[package]
name = "gilfoyle-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gilfoyle driving adapters (MCP over streamable HTTP) and the gilfoyle binary."

[lints]
workspace = true

[[bin]]
name = "gilfoyle"
path = "src/main.rs"

[dependencies]
gilfoyle-core = { workspace = true }
gilfoyle-system = { workspace = true }
gilfoyle-systemd = { workspace = true }

rmcp = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
