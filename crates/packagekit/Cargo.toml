[package]
name = "gilfoyle-packagekit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gilfoyle driven adapter that talks to PackageKit over in-process D-Bus."

[lints]
workspace = true

[dependencies]
gilfoyle-core = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[dev-dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "p2p", "service", "proxy"] }
