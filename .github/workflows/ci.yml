name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # The full mutation gate is far too slow to run on every push. Run it in
  # shards on a weekly schedule instead, and on demand via workflow_dispatch.
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  check:
    name: format, lint, test, dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN" \
            --component clippy --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny cargo-audit

      - name: Dependencies (licenses, bans, sources)
        run: cargo deny check

      - name: Security advisories
        run: cargo audit

  # On a pull request, mutate only the lines the PR touches. This is fast and
  # catches what the author just wrote; the whole-workspace gate runs weekly.
  mutants-diff:
    name: mutation gate (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-mutants-${{ runner.os }}-
            cargo-check-${{ runner.os }}-

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      - name: Mutation gate (changed lines only)
        env:
          MUTANTS_IN_PLACE: "0"
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --no-color "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo ">> empty diff, nothing to mutate"
            exit 0
          fi
          ./scripts/mutation-gate.sh --in-diff "$RUNNER_TEMP/pr.diff" --jobs 4

  # The whole-workspace gate, fanned out over shards. Schedule/dispatch only:
  # it is slow, and its 100% bar is also enforced locally by `make check`.
  mutants-full:
    name: mutation gate (full, shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-mutants-${{ runner.os }}-
            cargo-check-${{ runner.os }}-

      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants

      - name: Mutation gate (100% required)
        env:
          MUTANTS_IN_PLACE: "0"
        run: ./scripts/mutation-gate.sh --shard ${{ matrix.shard }}/${{ strategy.job-total }} --jobs 4
