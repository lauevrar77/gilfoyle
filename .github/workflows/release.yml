name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.89.0"
  TARGET: x86_64-unknown-linux-gnu
  ZIG_VERSION: "0.17.1"

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --no-modify-path --profile minimal \
            --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add the Rust targets for the macOS client
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install zig (the macOS client is cross-compiled from this Linux runner)
        run: |
          set -euo pipefail
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          ZIG_BIN="$(dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -type f -name zig -perm -u+x | head -1)")"
          [ -n "$ZIG_BIN" ] || { echo "!! zig was not extracted" >&2; exit 1; }
          echo "$ZIG_BIN" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Set up Node (the release ships the compiled website)
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-
            cargo-check-${{ runner.os }}-

      - name: Check the tag matches the crate version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CRATE="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$CRATE" ]; then
            echo "!! tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE}" >&2
            exit 1
          fi

      - name: Build and package (binary + website, into dist/)
        run: ./scripts/package-release.sh

      - name: Cross-compile and package the macOS client (into dist/)
        run: ./scripts/package-client-macos.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*.tar.gz dist/*.tar.gz.sha256
