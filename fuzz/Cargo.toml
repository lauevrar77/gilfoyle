[package]
name = "gilfoyle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Independent workspace: keeps the fuzz crate out of `cargo test` and
# `cargo mutants --workspace` for the main workspace.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
toml = "0.8"

[dependencies.gilfoyle-core]
path = "../crates/core"

[dependencies.gilfoyle-system]
path = "../crates/system"

[dependencies.gilfoyle-server]
path = "../crates/server"

[dependencies.gilfoyle-ssh]
path = "../crates/ssh"

[dependencies.gilfoyle-client]
path = "../crates/client"

[[bin]]
name = "uptime_parse"
path = "fuzz_targets/uptime_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorized_key"
path = "fuzz_targets/authorized_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_toml"
path = "fuzz_targets/config_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_config"
path = "fuzz_targets/client_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unit_name"
path = "fuzz_targets/unit_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_id"
path = "fuzz_targets/package_id.rs"
test = false
doc = false
bench = false
