[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Workspace path dependencies (`{ workspace = true }`) carry no version, which the
# wildcard check flags; allowing it keeps the idiom.
wildcards = "allow"

[[bans.deny]]
name = "openssl"
reason = "prefer rustls-free builds; gilfoyle terminates TLS outside the process"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
