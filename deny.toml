[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
# RUSTSEC-2026-0543: `chrono` is unmaintained and has no patched version. It is a
# non-optional dependency of `rmcp` (and of `schemars` via its `chrono04` feature), so it
# cannot be removed from the tree; gilfoyle only uses it to format RFC 3339 timestamps.
# Drop this ignore once `rmcp` stops depending on `chrono` (see issue #7).
ignore = ["RUSTSEC-2026-0543"]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Workspace path dependencies (`{ workspace = true }`) carry no version, which the
# wildcard check flags; allowing it keeps the idiom.
wildcards = "allow"

[[bans.deny]]
name = "openssl"
reason = "prefer rustls-free builds; gilfoyle terminates TLS outside the process"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
