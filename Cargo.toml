[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/system",
    "crates/systemd",
    "crates/packagekit",
    "crates/docker",
    "crates/server",
    "crates/ssh",
    "crates/client",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gilfoyle-core = { path = "crates/core" }
gilfoyle-system = { path = "crates/system" }
gilfoyle-systemd = { path = "crates/systemd" }
gilfoyle-packagekit = { path = "crates/packagekit" }
gilfoyle-docker = { path = "crates/docker" }
gilfoyle-ssh = { path = "crates/ssh" }
gilfoyle-client = { path = "crates/client" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
# Deliberately no `clock`: nothing here calls `Utc::now()`, only formatting from a stored
# timestamp. Leaving it off keeps `iana-time-zone`/`core-foundation-sys` out of the tree, so
# the macOS client cross-compiles on Linux without the Apple SDK (see docs/INSTALL.md).
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus_systemd = { version = "0.26201", default-features = false, features = ["systemd1", "zbus-async-tokio"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }

regex = "1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http = "1"
http-body-util = "0.1"
tower-service = "0.3"
bytes = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "client", "transport-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
disallowed_methods = "deny"
